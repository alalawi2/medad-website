<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<title>Reset Password — Medad</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com/">
<link rel="preconnect" href="https://fonts.gstatic.com/" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Reem+Kufi:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
:root{--paper:#faf8f4;--paper-2:#f0ede7;--ink:#14110d;--ink-soft:#38322c;--gold:#b8853a;--gold-deep:#8e6326;--seal:#8a2e2e;--rule:rgba(20,17,13,0.16);--sans:'Helvetica Neue',Helvetica,Arial,sans-serif;--mono:'JetBrains Mono',monospace;--ar:'Amiri','Noto Naskh Arabic',serif}
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.55;min-height:100vh}
.wrap{max-width:420px;margin:0 auto;padding:80px 20px;text-align:center}
.logo{font-family:var(--ar);font-size:42px;font-weight:700;color:var(--ink);margin-bottom:4px}
.logo-sub{font-family:var(--mono);font-size:12px;letter-spacing:.2em;color:var(--ink-soft);text-transform:uppercase;margin-bottom:32px}
.card{background:var(--paper-2);border:1px solid var(--rule);border-radius:8px;padding:32px 28px;text-align:left}
.card h2{font-size:18px;font-weight:700;margin-bottom:16px;text-align:center}
.field{margin-bottom:14px}
.field label{display:block;font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-soft);margin-bottom:6px}
.field input{width:100%;padding:10px 14px;background:var(--paper);border:1px solid var(--rule);border-radius:6px;color:var(--ink);font-size:14px;font-family:var(--sans);outline:none}
.field input:focus{border-color:var(--gold)}
.btn{display:block;width:100%;padding:12px;border-radius:6px;border:none;background:var(--ink);color:var(--paper);font-size:14px;font-weight:600;cursor:pointer;font-family:var(--sans);transition:.2s}
.btn:hover{background:var(--seal)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.alert{padding:12px 16px;border-radius:6px;font-size:13px;margin-bottom:14px;display:none}
.alert-error{background:#fef2f2;color:#991b1b;border:1px solid #fca5a5}
.alert-success{background:#f0fdf4;color:#166534;border:1px solid #86efac}
.status{text-align:center;padding:40px 0;color:var(--ink-soft);font-size:14px}
.status .spinner{display:inline-block;width:24px;height:24px;border:3px solid var(--rule);border-top-color:var(--gold);border-radius:50%;animation:spin .8s linear infinite;margin-bottom:12px}
@keyframes spin{to{transform:rotate(360deg)}}
.back{display:inline-block;margin-top:16px;color:var(--gold-deep);font-size:13px;text-decoration:none;border-bottom:1px solid var(--gold-deep)}
</style>
</head>
<body>
<div class="wrap">
  <div class="logo">مداد</div>
  <div class="logo-sub">Reset Password</div>

  <!-- Loading state while exchanging code -->
  <div id="loadingView" class="status">
    <div class="spinner"></div>
    <div>Verifying reset link...</div>
  </div>

  <!-- Error state -->
  <div id="errorView" style="display:none" class="status">
    <div id="errorMsg" style="color:var(--seal);font-weight:600;margin-bottom:8px"></div>
    <a class="back" href="./worklog.html">Back to Work Log</a>
  </div>

  <!-- Reset form -->
  <div id="resetView" style="display:none">
    <div class="card">
      <h2>Set New Password</h2>
      <div id="resetAlert" class="alert"></div>
      <form id="resetForm">
        <div class="field"><label>New Password</label><input type="password" id="pw1" required placeholder="Min 6 characters" minlength="6" autocomplete="new-password"></div>
        <div class="field"><label>Confirm Password</label><input type="password" id="pw2" required placeholder="Repeat password" minlength="6" autocomplete="new-password"></div>
        <button type="submit" class="btn" id="resetBtn">Update Password</button>
      </form>
    </div>
    <a class="back" href="./worklog.html">Back to Work Log</a>
  </div>

  <!-- Success state -->
  <div id="successView" style="display:none" class="status">
    <div style="font-size:32px;margin-bottom:12px">&#10003;</div>
    <div style="font-weight:600;color:var(--ink);margin-bottom:8px">Password updated!</div>
    <div>Redirecting to Work Log...</div>
  </div>
</div>

<script>
const SUPABASE_URL='https://xrxekxvyzayudgkixmza.supabase.co';
const SUPABASE_ANON='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhyeGVreHZ5emF5dWRna2l4bXphIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA1MDM1NzIsImV4cCI6MjA5NjA3OTU3Mn0.dK21GXduLQV2aOsfs743FpYthhA3UNjIRxwYXDAIEHw';
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_ANON);

function show(id){['loadingView','errorView','resetView','successView'].forEach(v=>document.getElementById(v).style.display='none');document.getElementById(id).style.display='block'}
function showError(message){document.getElementById('errorMsg').textContent=message;show('errorView')}
async function getActiveSession(){const{data:{session}}=await sb.auth.getSession();return session||null}
async function bootstrapRecoverySession(){
  const params=new URLSearchParams(window.location.search);
  const code=params.get('code');
  const hashParams=new URLSearchParams((window.location.hash||'').replace(/^#/,''));
  const accessToken=hashParams.get('access_token');
  const refreshToken=hashParams.get('refresh_token');
  const isRecoveryHash=hashParams.get('type')==='recovery';

  if(code){
    const{error}=await sb.auth.exchangeCodeForSession(code);
    window.history.replaceState(null,'',window.location.pathname);
    if(error)return{error:'Invalid or expired reset link. Please request a new one.'};
    const session=await getActiveSession();
    if(!session)return{error:'Reset session could not be established. Please request a new link.'};
    return{session};
  }

  if(isRecoveryHash&&accessToken&&refreshToken){
    const{error}=await sb.auth.setSession({access_token:accessToken,refresh_token:refreshToken});
    window.history.replaceState(null,'',window.location.pathname);
    if(error)return{error:'Invalid or expired reset link. Please request a new one.'};
    const session=await getActiveSession();
    if(!session)return{error:'Reset session could not be established. Please request a new link.'};
    return{session};
  }

  const session=await getActiveSession();
  if(session)return{session};

  return{error:'No reset token found. Please request a password reset from the Work Log page.'};
}

async function init(){
  const recovery=await bootstrapRecoverySession();
  if(recovery.error){showError(recovery.error);return}
  show('resetView');
}

document.getElementById('resetForm').addEventListener('submit',async(e)=>{
  e.preventDefault();
  const pw=document.getElementById('pw1').value;
  const pw2=document.getElementById('pw2').value;
  const btn=document.getElementById('resetBtn');
  const a=document.getElementById('resetAlert');
  a.style.display='none';

  if(pw!==pw2){a.className='alert alert-error';a.textContent='Passwords do not match.';a.style.display='block';return}
  if(pw.length<6){a.className='alert alert-error';a.textContent='Min 6 characters.';a.style.display='block';return}

  btn.disabled=true;btn.textContent='Updating...';
  const{error}=await sb.auth.updateUser({password:pw});

  if(error){
    a.className='alert alert-error';a.textContent=error.message;a.style.display='block';
    btn.disabled=false;btn.textContent='Update Password';
  }else{
    show('successView');
    setTimeout(()=>{window.location.href='./worklog.html'},2000);
  }
});

init();
</script>
</body>
</html>
